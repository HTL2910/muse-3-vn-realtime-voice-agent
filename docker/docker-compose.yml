# Local infrastructure for vn-realtime-voice-agent.
#
# Redis  — durable session state (leases + heartbeats), per-call state.
# Kafka  — callback queue + DB outbox transport.
# PostgreSQL — orders/appointments/tickets system of record (local dev
#   mirror; production uses the real OMS/WMS/CRM behind tool_gateway).
#
# Usage:  docker compose -f docker/docker-compose.yml up -d
#         docker compose -f docker/docker-compose.yml down -v
#
# The app service is NOT here yet: it is added when the first module
# lands (media_gateway / orchestrator). Until then this file only
# brings up the infrastructure the modules depend on.
#
# Credentials below are LOCAL DEVELOPMENT defaults only. Override
# them with a .env file (see .env.example) and never reuse them in
# production.

services:
  redis:
    image: redis:7-alpine
    container_name: voiceai-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: voiceai-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: voiceai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voiceai}
      POSTGRES_USER: ${POSTGRES_USER:-voiceai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceai-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-voiceai} -d $${POSTGRES_DB:-voiceai}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
  kafka_data:
  postgres_data:
